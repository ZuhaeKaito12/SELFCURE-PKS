<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="refresh" content="5">
    <title>SELFCURE PKS</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f6f9; color: #0d1726;
               font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 16px; }
        .card { background: #fff; border-radius: 18px; padding: 32px 28px; max-width: 420px;
                box-shadow: 0 0 0 1px rgba(13, 23, 38, .05), 0 12px 28px -12px rgba(13, 23, 38, .18); }
        h1 { font-size: 1.25rem; margin: 16px 0 8px; }
        p { color: #475467; margin: 4px 0; line-height: 1.5; }
        .spinner { width: 36px; height: 36px; margin: 0 auto; border-radius: 50%;
                   border: 3px solid #eaeffb; border-top-color: #2148c0; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
    </style>
</head>
<body>
    <div class="card">
        <div class="spinner" aria-hidden="true"></div>
        <h1>SELFCURE PKS is starting up</h1>
        <p>This takes a few seconds. The page will reload by itself.</p>
        <p lang="ms">Laman web sedang dimulakan. Halaman ini akan dimuat semula secara automatik.</p>
    </div>
</body>
</html>
