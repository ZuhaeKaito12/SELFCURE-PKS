# Builds the Laravel app and deploys it to Azure App Service on every push to main.
#
# One-time setup in GitHub (Settings > Secrets and variables > Actions):
#   - Variable  AZURE_WEBAPP_NAME             the App Service name, e.g. selfcure-pks
#   - Secret    AZURE_WEBAPP_PUBLISH_PROFILE  contents of the publish profile
#                                             downloaded from the App Service overview page
name: Deploy to Azure App Service

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, pdo_mysql, zip
          tools: composer:v2

      - name: Install PHP dependencies (production only)
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Package the app
        run: zip -qr release.zip . -x ".git/*" ".github/*" "tests/*" "phpunit.xml" "storage/logs/*.log"

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release.zip
